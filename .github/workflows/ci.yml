name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The DSP property tests deliberately need only numpy + pillow: the signal
      # bank is hand-rolled, so nothing in tests/ pulls torch, sklearn or OpenCV.
      # That keeps CI to a few seconds and proves the "no heavy deps for the
      # classical path" claim on every push.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pillow pytest

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Run the DSP property tests
        run: pytest

      - name: Import the classical path with the heavy deps absent
        run: |
          python - <<'PY'
          import sys
          BLOCKED = {"cv2", "torch", "torchvision", "sklearn", "flask",
                     "joblib", "matplotlib", "pandas", "pyarrow"}

          class Block:
              def find_module(self, name, path=None):
                  if name.split(".")[0] in BLOCKED:
                      raise ImportError(f"blocked for this check: {name}")
                  return None

          sys.meta_path.insert(0, Block())
          import audio_detect, detector, patterns, text_detect, watermark  # noqa: F401
          print("classical path imports with numpy + pillow only")
          PY
